<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Talyca Store Metro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .navbar-pink .navbar-brand,
        .navbar-pink .navbar-link {
            color: #ffffff !important;
        }

        .navbar-brand {
            font-family: 'Times New Roman', Times, serif;
        }

        .navbar-pink .navbar-link:hover {
            color: #ffede1 !important;
        }
    </style>

</head>

<body>
    <!-- 1. NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container">

            <img src="gambar/logo.jpg" alt="Logo Langgas Sinau" width="45" height="45" class="border-radius-100 me-2 ">

            <a class="navbar-brand fw-bold" href="#">
                Talyca Store
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html#">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#produk">Produk</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#vidio">Vidio</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#tentang">Tentang kami</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#kontak">Kontak</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#lokasi">Lokasi</a></li>
                </ul>
                <li id="auth-menu"></li>
            </div>
        </div>
    </nav>
    <main class="auth-page">
        <section class="auth-card">
            <h1>Masuk Akun</h1>
            <p class="subtitle">Silahkan login untuk melihat halaman akun</p>

            <p id="pesan" class="alert" hidden></p>

            <form id="formLogin" novalidate>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukan Nama" autocomplete="username"
                    required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Password"
                    autocomplete="current-password" required>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <div class="demo-info">
                <strong>Akun demo</strong> <br>
                admin | admin123 <br>
                david | david123
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Talyca Store Metro. Website sampel latihan PKL, bukan website resmi.</p>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        const pesan = document.getElementById("pesan");
        function tampil(teks, jenis) {
            pesan.textContent = teks;
            pesan.className = "alert" + jenis;
            pesan.hidden = false
        }

        // pesan dari halaman lain (?pesan=logout / ?pesan=wajib)
        const p = new URLSearchParams(window.location.search).get("pesan");
        if (p === "logout") tampil("Anda berhasil logout.", "ok");
        if (p === "wajib") tampil("Silahkan login terlebih dahulu.", "err");

        // Jika sudah login langsung ke dashboard
        if (getUser()) window.location.href = "dashboard.html";

        document.getElementById("formLogin").addEventListener("submit", function (e) {
            e.preventDefault();
            const u = document.getElementById("username").value.trim();
            const pw = document.getElementById("password").value;
            if (u === "" || pw === "") { tampil("Username dan password wajib diisi.", "err"); return; }
            if (login(u, pw)) { window.location.href = "dashboard.html"; }
            else { tampil("Username atau password salah.", "err"); }
        });

    </script>

</body>

</html>
